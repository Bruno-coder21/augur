name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "matplotlib>=3.8,<4" "jsonschema>=4,<5"
      - name: Run tests
        run: python -m pytest -q

  hygiene:
    name: no bytecode, no binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse compiled or binary files (catalog rule 17)
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(pyc|pyo|so|dll|dylib|exe|bin|whl|zip|tar|gz)$' || true)
          if [ -n "$bad" ]; then echo "binary files tracked:"; echo "$bad"; exit 1; fi
          git ls-files -z | xargs -0 file --mime-type | grep -E 'application/(x-executable|x-sharedlib|x-mach-binary|x-dosexec|wasm)' && exit 1 || true
          echo "clean"

  hermes-validate:
    name: hermes plugins validate (v0.23.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@3b421578588243f920886e6fe79a6faa87ea026e
        with:
          path: .
          hermes-ref: 3b421578588243f920886e6fe79a6faa87ea026e
